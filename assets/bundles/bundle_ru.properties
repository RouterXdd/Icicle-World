block.icicle-world-proto-drill.name=Прото Бур
block.icicle-world-proto-drill.description=Когда поставлен на руду, выводит ресурсы с медленной скоростью. Способен добывать только базовые ресурсы.\n\nИз-за нестабильной спруктуры безконтрольно вызывает саморазрушающие молнии
block.icicle-world-proto-drill.details=Когда прочность достигает своего минимального лимита, то его эффективность падает в разы. Убедитесь что блики ремонтируют его постоянно
block.icicle-world-advanced-drill.name=Продвинутый Бур
block.icicle-world-advanced-drill.description=Улучшенный бур, способный добывать соптин. Добывает с большей скоростью, чем прото бур. И вызывает менее опасные молнии с большей задержкой
block.icicle-world-engine-drill.name=Двигательный Бур
block.icicle-world-engine-drill.description=Использует электрический мотор для добычи. Способен добывать полоний. Самый стабильный бур
block.icicle-world-nuclear-drill.name=Ядерный Бур
block.icicle-world-nuclear-drill.description=Ультимативный бур. Обменивает стабильность на эффективность. Требует большое количество ремонта и энергии
block.icicle-world-mechanical-cutter.name=Механический Рубитель
block.icicle-world-mechanical-cutter.description=Когда установлен перед споровым днревом, добывает споровую древесину с медленныс темпом
block.icicle-world-laser-cutter.name=Лазерный Рубитель
block.icicle-world-laser-cutter.description=Использует лазерные технологии для быстрого получения древесины, но требует энергию
block.icicle-world-ore-finder.name=Искатель Руд
