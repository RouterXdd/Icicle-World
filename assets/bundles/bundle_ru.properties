block.icicle-world-armored-node.description=Большой силовой узел. Хранит больше энергии и испускает молнии вокруг если рядом противник
block.icicle-world-recall-node.name=Отзывающий Узел
block.icicle-world-recall-node.description=Большой силовой узел. Имеет больше соединений, чем Старый Узел и хранит больше энергии
block.icicle-world-scrap-solar.name=Металлоломная Солнечная Панель
