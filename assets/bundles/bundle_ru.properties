block.icicle-world-methane-burner.description=Генерирует энергию сжигая метан, производит отходы в процессе
block.icicle-world-nuclear-reactor.name=Ядерный Реактор
block.icicle-world-nuclear-reactor.description=Генерирует большое количество энергии из зарядов полония. Взрывается при недостаточном снабжение охлаждителем. Взрыв достаточно силён, чтобы обрушить множество больших камней, которые требует усилия чтобы убрать их
block.icicle-world-liquid-turbine.name=Жикостная Турбина
