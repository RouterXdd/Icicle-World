block.icicle-world-polonium-solar.description=Устанавливается на кратеры, где преобладает солнечный свет. Производит больше всего энергии и занимает ещё больше места
block.icicle-world-decomposer.name=Разлагатель
block.icicle-world-decomposer.description=Производит энергию при сгорании споровой древесины. Боевые единицы, находящиеся рядом с Разлагателем, покрываются сажей
